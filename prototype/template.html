:root{
  color-scheme:light;
  --bg:#F3F3EF; --panel:#FFFFFF; --ink:#16191B; --soft:#596166; --faint:#8C9397;
  --line:#E4E5E0; --hair:#EEEFEA; --accent:#B3521F; --info:#2A6F97; --good:#1E8A5A;
  --p0:#2E9E5B; --p1:#A3C940; --p2:#F2B632; --p3:#EB7A2E; --p4:#D23B2E;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,24,26,.05),0 10px 30px rgba(20,24,26,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;font-weight:650}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.soft{color:var(--soft)} .faint{color:var(--faint)} .small{font-size:13px}

/* ---------- header ---------- */
.top{height:56px;flex:none;display:flex;align-items:center;gap:18px;padding:0 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;font:700 17px var(--display);letter-spacing:-.015em}
.brand b{color:var(--accent)}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center}
#nav{display:flex;gap:2px;margin:0 auto;background:var(--bg);border-radius:12px;padding:3px}
#nav button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--soft);font-size:14.5px;transition:background .2s,color .2s;display:inline-flex;align-items:center;gap:7px}
#nav button svg{opacity:.75}
#helpBtn .qm{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font:700 12px/18px var(--body);text-align:center}
#tourBtn{margin-left:-10px}
#nav button:hover{color:var(--ink)}
#nav button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;transition:border-color .15s,background .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:#C9CBC4}
.btn:active{transform:translateY(1px)}
.btn.main{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.main:hover{background:#000}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:15px;height:15px}
.menubtn{display:none}

/* ---------- pages ---------- */
main{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none}
.page.show{display:block;animation:fade .3s ease}
.page.doc{overflow-y:auto;scroll-behavior:smooth}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wrap{max-width:1180px;margin:0 auto;padding:34px 28px 90px}
.pagetitle{margin:0 0 6px;font-size:clamp(26px,3vw,36px)}
.pagesub{color:var(--soft);margin:0 0 26px;max-width:64ch}

/* ---------- map ---------- */
#stage{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,#FBFBF8 0%,#EDEEE8 70%,#E6E7E1 100%);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.hand{cursor:pointer}
.panel{position:absolute;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid rgba(228,229,224,.9);border-radius:var(--r);box-shadow:var(--shadow);z-index:5}
.panel.left{top:14px;left:14px;bottom:14px;width:320px;overflow-y:auto;padding:18px 18px 16px;scrollbar-width:thin}
.panel.right{top:14px;right:14px;bottom:14px;width:350px;overflow-y:auto;padding:18px 20px 20px;display:none;scrollbar-width:thin}
.panel.right.open{display:block;animation:slidein .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.x{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;line-height:1}
.lp-h{font-size:21px;line-height:1.15;margin-bottom:4px}
.lbl{font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.lbl span{letter-spacing:0;text-transform:none;font-family:var(--body);font-weight:400}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--soft);transition:background .2s}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:#C9CBC4}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;font-size:14px;background:#fff}
.count-line{font-size:13px;color:var(--soft);margin-top:10px}
.count-line b{color:var(--ink)}

/* histogram in the side panel */
.hist{display:flex;align-items:flex-end;gap:6px;height:92px;padding-top:18px}
.hist button{flex:1;border:0;padding:0;background:none;cursor:pointer;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative}
.hist .b{border-radius:6px 6px 3px 3px;transition:height .6s cubic-bezier(.2,.8,.2,1),opacity .2s;min-height:4px}
.hist .c{position:absolute;left:0;right:0;text-align:center;font:600 12px var(--mono);color:var(--soft)}
.hist button[aria-pressed=false] .b{opacity:.22}
.hist-x{display:flex;gap:6px;font:500 12px var(--mono);color:var(--faint);margin-top:5px}
.hist-x span{flex:1;text-align:center}
.prow{display:grid;grid-template-columns:22px 1fr 34px;gap:9px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:6px 7px;cursor:pointer;font-size:13.5px;line-height:1.25}
.prow:hover{background:var(--bg)}
.prow[aria-pressed=true]{background:#FBF1EA;border-color:#EBC9B3}
.prow .t{display:flex;flex-direction:column;gap:4px}
.prow .tr{height:5px;border-radius:3px;background:var(--hair);overflow:hidden}
.prow .tr i{display:block;height:100%;background:var(--p3);border-radius:3px;transition:width .6s}
.prow .n{font:600 12.5px var(--mono);text-align:right;color:var(--soft)}
.ico{width:20px;height:20px;flex:none;color:var(--soft)}
.story{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:13.5px;line-height:1.3;transition:all .15s}
.story:hover{border-color:#C9CBC4;transform:translateX(2px)}
.story[aria-pressed=true]{border-color:var(--accent);background:#FBF1EA}
.story b{font:700 22px var(--display);color:var(--accent);text-align:center}
.tog{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:3px 0;cursor:pointer}
.tog input{accent-color:var(--ink);width:15px;height:15px;margin:0}
.grow{display:grid;grid-template-columns:12px 1fr 26px;gap:9px;align-items:center;width:100%;border:0;background:none;padding:6px 6px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px}
.grow:hover{background:var(--bg)}
.grow[aria-pressed=true]{background:var(--bg);font-weight:600}
.grow .sw{width:12px;height:12px;border-radius:4px}
.gradbar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--p0),var(--p1),var(--p2),var(--p3),var(--p4))}

/* map controls */
.ctrl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:6;transition:right .3s}
#p-map.side .ctrl{right:378px}
.ctrl .grp{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ctrl button{width:40px;height:40px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink)}
.ctrl button+button{border-top:1px solid var(--hair)}
.ctrl button:hover{background:var(--bg)}
.ctrl svg{width:19px;height:19px}
#dimBtn{font:700 12.5px var(--mono)}
#compass svg{transition:transform .05s linear}
.timeline{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;font-size:13.5px;transition:left .3s}
#p-map.lp .timeline{left:calc(50% + 167px)}
#p-map.side .timeline{left:calc(50% - 182px)}
#p-map.lp.side .timeline{left:calc(50% - 15px)}
.timeline .seg{min-width:150px}
.timeline .seg button{white-space:nowrap}
.tw-info{color:var(--soft);font-size:13px;white-space:nowrap}
.tw-info b{color:var(--ink)}
.tw-key{display:inline-flex;align-items:center;gap:5px}
.tw-key i{width:9px;height:9px;border-radius:50%;display:inline-block}
.banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;border-radius:12px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:12px;font-size:14px;box-shadow:var(--shadow);max-width:min(620px,calc(100% - 700px));min-width:280px}
.banner button{border:0;background:#fff;color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.hint{position:absolute;right:14px;top:14px;font-size:12.5px;color:var(--soft);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:10px;padding:6px 11px;z-index:5;transition:opacity .6s,right .3s;pointer-events:none}
#p-map.side .hint{right:378px}
.hint.gone{opacity:0}
.tour{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:8;width:min(460px,calc(100% - 28px));background:#fff;border-radius:var(--r);box-shadow:0 20px 50px rgba(20,24,26,.2);padding:16px 18px 14px;display:none;border:1px solid var(--line)}
.tour .st{font:600 11.5px var(--mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.tour h3{font-size:18px;margin:4px 0 6px}
.tour p{color:var(--soft);font-size:14.5px;margin-bottom:12px}
.tour .row{display:flex;gap:8px;align-items:center}
.tour .dots{display:flex;gap:4px;margin-right:auto}
.tour .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour .dots i.on{background:var(--accent)}

/* place panel */
.pp-k{font-size:13px;color:var(--soft);padding-right:36px}
.pp-h{font-size:25px;line-height:1.1;margin:3px 0 12px;padding-right:36px}
.pp-top{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.pp-top .big{font:700 15px var(--body)}
.pcheck{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--hair);font-size:13.5px;line-height:1.3}
.pcheck .v{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.yn{font:600 11.5px var(--mono);padding:2px 8px;border-radius:20px;background:var(--hair);color:var(--faint)}
.yn.y{background:#F6E4DA;color:var(--p4)}
.pcheck.y .ico{color:var(--p4)}
.pp-sec{margin-top:16px}
.pp-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:20px;background:var(--bg)}

/* charts */
.viz{position:relative}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:var(--lw,150px) 1fr 64px;gap:12px;align-items:center;font-size:13.5px;border-radius:8px;cursor:default}
.hb[data-pick],.hb[data-spot],.hb[data-region]{cursor:pointer}
.hb[data-pick]:hover .l,.hb[data-spot]:hover .l,.hb[data-region]:hover .l{text-decoration:underline}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:12px;background:var(--hair);border-radius:6px;overflow:hidden;position:relative}
.fill{display:block;height:100%;width:var(--w);border-radius:6px;transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.in .fill{transform:none}
.hb .v{font:600 12.5px var(--mono);text-align:right;color:var(--soft)}
.ring circle.arc{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.in circle.arc{stroke-dashoffset:var(--off)}
.rings{display:flex;gap:18px;flex-wrap:wrap}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;color:var(--soft);max-width:150px}
.vcols{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:24px}
.vcols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.vcols .col{border-radius:8px 8px 3px 3px;transform:scaleY(0);transform-origin:bottom;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.in .vcols .col{transform:none}
.vcols .ct{position:absolute;left:0;right:0;text-align:center;font:600 13px var(--mono);color:var(--soft)}
.vcols>div:hover .col{filter:brightness(.92)}
.vx{display:flex;gap:10px;font:500 12.5px var(--mono);color:var(--faint);margin-top:6px}
.vx span{flex:1;text-align:center}
.dots-plot .row{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;height:58px;border-bottom:1px solid var(--hair)}
.dots-plot .area{position:relative;height:100%}
.dots-plot .dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;opacity:.8;cursor:pointer;transition:transform .15s,opacity .5s;border:1px solid rgba(255,255,255,.8)}
.dots-plot .dot:hover{transform:scale(1.7);opacity:1;z-index:2}
.dots-plot .med{position:absolute;top:8px;bottom:8px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.axis{position:relative;height:22px;margin-left:142px;font:500 11.5px var(--mono);color:var(--faint)}
.axis span{position:absolute;transform:translateX(-50%);top:4px}
.dumb .row{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;height:26px;font-size:13px;cursor:pointer;border-radius:6px}
.dumb .row:hover{background:var(--bg)}
.dumb .area{position:relative;height:100%}
.dumb .ln{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:#A9C6D8;border-radius:2px}
.dumb .pt{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:2px solid #fff}
.stack{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px}
.stack>div{display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:#fff;cursor:pointer;transition:flex-grow 1s,filter .15s;min-width:0}
.stack>div:hover{filter:brightness(1.08)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--mono);font-size:11px;fill:var(--faint)}
svg.chart .pt{cursor:pointer;transition:r .15s}
svg.chart .pt:hover{stroke:var(--ink);stroke-width:2}
.heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.heat th{font-weight:600;color:var(--soft);font-size:12px;text-align:center;padding:4px}
.heat th:first-child{text-align:left}
.heat td{padding:8px 6px;text-align:center;border-radius:6px;font:600 12.5px var(--mono)}
.heat td.nm{text-align:left;font:600 13.5px var(--body);background:none;cursor:pointer}
.heat tr:hover td.nm{text-decoration:underline}
.rank{display:grid;gap:4px}
.rank .r{display:grid;grid-template-columns:24px 1fr 46px;gap:8px;align-items:center;font-size:13.5px;padding:5px 8px;border-radius:8px;background:var(--bg);cursor:pointer;transition:background .3s}
.rank .r.new{background:#E6F0F6}
.rank .r .mv{font:600 11.5px var(--mono);text-align:right}
.sl{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.sl input{width:100%;accent-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi b{display:block;font:700 34px/1 var(--display);letter-spacing:-.03em;color:var(--c,var(--ink))}
.kpi span{display:block;font-size:13.5px;color:var(--soft);margin-top:6px;line-height:1.35}

/* insights */
.inav{position:sticky;top:0;z-index:4;background:rgba(243,243,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.inav .in-w{max-width:1180px;margin:0 auto;padding:10px 28px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.inav .in-w::-webkit-scrollbar{display:none}
.inav button{border:1px solid transparent;background:none;border-radius:20px;padding:5px 12px;font-size:13px;color:var(--soft);cursor:pointer;white-space:nowrap}
.inav button.on{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600}
.isec{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:36px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 30px;margin-bottom:18px;scroll-margin-top:70px}
.isec .kick{font:600 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--c,var(--accent));display:flex;gap:8px;align-items:center}
.isec .kick .ico{color:var(--c,var(--accent));width:18px;height:18px}
.isec .bign{font:700 44px/1 var(--display);letter-spacing:-.035em;color:var(--c,var(--accent));margin:12px 0 8px}
.isec h2{font-size:20px;line-height:1.25;margin-bottom:8px}
.isec .lead{color:var(--soft);font-size:14.5px;margin-bottom:14px}
.isec .acts{display:flex;gap:8px;flex-wrap:wrap}
.isec details{margin-top:16px;border-top:1px solid var(--hair);padding-top:10px;font-size:13.5px;color:var(--soft)}
.isec summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:13.5px;list-style:none}
.isec summary::-webkit-details-marker{display:none}
.isec summary::after{content:" +";color:var(--accent)}
.isec details[open] summary::after{content:" −"}
.isec details p{margin-top:8px}
.vt{font-size:12.5px;color:var(--faint);margin:0 0 10px}
.tabs2{display:inline-flex;margin-bottom:14px}
.note{font-size:12.5px;color:var(--faint);margin-top:10px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* actions */
.alist{display:grid;gap:12px}
.acard{display:grid;grid-template-columns:120px 1fr auto;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
.acard .fig b{display:block;font:700 34px/1 var(--display);color:var(--accent);letter-spacing:-.03em}
.acard .fig span{font-size:12.5px;color:var(--soft);line-height:1.3;display:block;margin-top:5px}
.acard .mini{height:6px;border-radius:3px;background:var(--hair);margin-top:8px;overflow:hidden}
.acard .mini i{display:block;height:100%;background:var(--accent)}
.acard h3{font-size:17px;line-height:1.3;margin-bottom:4px}
.acard p{font-size:14px;color:var(--soft)}
.acard details{margin-top:6px;font-size:13.5px;color:var(--soft)}
.acard summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none}

/* places table */
.tablebox{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 260px)}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th{position:sticky;top:0;background:#fff;text-align:left;font-weight:600;color:var(--soft);font-size:12.5px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
table.list th.on{color:var(--ink)}
table.list td{padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:middle}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:#FAFAF7}
.pstrip{display:inline-flex;gap:3px;vertical-align:middle}
.pstrip i{width:11px;height:11px;border-radius:3px;background:var(--hair)}
.pstrip i.y{background:var(--p3)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 7px;border-radius:11px;font:700 12.5px var(--mono)}
.kmbar{display:flex;align-items:center;gap:8px}
.kmbar .track{width:80px;height:6px}
.kmbar .fill{transform:none;background:var(--info)}

/* about */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px}
.acd h3{font-size:15px;margin-bottom:4px}
.acd a{color:var(--accent);font-size:13px}
.facts{width:100%;border-collapse:collapse;font-size:13.5px}
.facts td{padding:8px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.facts td:last-child{text-align:right;font-weight:600;padding-left:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.h2s{font-size:20px;margin:30px 0 12px}

/* report */
.modal{position:fixed;inset:0;z-index:50;background:rgba(22,25,27,.4);backdrop-filter:blur(3px);display:none;overflow-y:auto;padding:24px 16px}
.modal.open{display:block;animation:fade .2s}
.sheet{max-width:1080px;margin:0 auto;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative}
.sheet-head{background:#fff;border-bottom:1px solid var(--line);padding:22px 28px}
.sheet-body{padding:22px 28px 30px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;margin:0 6px 7px 0;font-size:13.5px;cursor:pointer;background:#fff}
.opt input{accent-color:var(--ink);margin:0}
textarea,select,input[type=text]{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
.nb{background:var(--bg);border-radius:10px;padding:11px 13px;font-size:13.5px;margin-top:10px}

.tt{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;line-height:1.35;padding:7px 10px;border-radius:9px;opacity:0;transition:opacity .12s;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tt b{font-weight:600}
.tt .pstrip i{background:rgba(255,255,255,.2)}
.tt .pstrip i.y{background:var(--p2)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:95}


/* ---------- simple-UI additions ---------- */
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#E4E7EA;color:#4B5359;font:700 11px/1 Georgia,serif;font-style:italic;cursor:help;vertical-align:1px;flex:none;text-transform:none;letter-spacing:0}
.info:hover,.info:focus{background:var(--ink);color:#fff;outline:none}
.ndot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:700 11.5px var(--body);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);flex:none;vertical-align:middle}
.ndot.big{width:34px;height:34px;font-size:16px}
.tt .ndot{border-color:rgba(255,255,255,.9);width:18px;height:18px;font-size:11px}
.tt .tline{display:inline-flex;align-items:center;gap:6px;margin:4px 0}
.tt .tprobs{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px}
.tt .tprobs span{display:flex;align-items:center;gap:6px;color:#FFD6C2}
.pstrip{display:inline-flex;gap:3px;vertical-align:middle}
.pstrip i{width:20px;height:20px;border-radius:6px;background:#F0F1EC;color:#C3C8C5;display:inline-flex;align-items:center;justify-content:center}
.pstrip i.y{background:#FDE3DC;color:#C2341F}
.tt .pstrip i{background:rgba(255,255,255,.12);color:rgba(255,255,255,.35)}
.tt .pstrip i.y{background:#F2B632;color:#16191B}
.nkey{display:grid;gap:3px}
.nkey button{display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center;border:1px solid transparent;background:none;border-radius:9px;padding:5px 7px;cursor:pointer;text-align:left;font-size:13.5px}
.nkey button:hover{background:var(--bg)}
.nkey button[aria-pressed=false]{opacity:.35}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);flex:none;vertical-align:middle}
.badge .ico{color:#fff!important;stroke-width:2.3}
.lay{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 6px;border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.3}
.lay:hover{background:var(--bg)}
.lay .sub{display:block;color:var(--faint);font-size:12px;margin-top:2px}
